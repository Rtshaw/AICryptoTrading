services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cryptotrading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptotrading}
      POSTGRES_DB: ${POSTGRES_DB:-cryptotrading}
    ports:
      # Host port 55532 (not 5432) - avoids clashing with a native Postgres
      # install and with the sibling TWSEDailyTrading project's own 55432.
      - "55532:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cryptotrading}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside this container "localhost" is the container itself, not the
      # postgres container - reach it via the compose service name instead.
      DATABASE_URL: postgres://${POSTGRES_USER:-cryptotrading}:${POSTGRES_PASSWORD:-cryptotrading}@postgres:5432/${POSTGRES_DB:-cryptotrading}?sslmode=disable
    # AI_SIGNAL_SYSTEM_PROMPT/AI_WATCHLIST_SYSTEM_PROMPT's multi-line
    # `KEY<<EOF ... EOF` heredoc syntax in .env (see .env.example) is a
    # bespoke convention this project's own PowerShell restart script
    # parses - Docker Compose's env_file loader only understands plain
    # KEY=value lines, so those two vars silently won't be set in this
    # container and the backend falls back to its built-in default prompts
    # (internal/config/config.go). Use the native restart path (README.md)
    # if you need the customized prompt text.
    ports:
      - "${SERVER_PORT:-8280}:${SERVER_PORT:-8280}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:${SERVER_PORT:-8280}
      VITE_WS_URL: ws://localhost:${SERVER_PORT:-8280}/ws/market
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5290:5290"
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
